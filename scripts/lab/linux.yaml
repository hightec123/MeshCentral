# Disposable native-agent compatibility lab. No host filesystem mounts, Docker,
# public listeners, or production agent state. Use a separate LIMA_HOME.
minimumLimaVersion: 2.0.0
base:
  - template:_images/ubuntu-24.04
vmType: vz
arch: aarch64
cpus: 2
memory: 2GiB
disk: 8GiB
mounts: []
containerd:
  system: false
  user: false
ssh:
  loadDotSSHPubKeys: false
portForwards:
  - guestPortRange: [1, 65535]
    proto: any
    ignore: true
